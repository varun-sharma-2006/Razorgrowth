<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="42" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">RazorGrowth Architecture</text>
  <text x="450" y="65" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">Permissioned AI Merchant Growth Agent for Razorpay</text>

  <!-- Frontend Box -->
  <rect x="50" y="95" width="800" height="70" rx="12" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="125" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#818cf8" text-anchor="middle">React + TypeScript Frontend (Vite + Tailwind CSS)</text>
  <text x="450" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">Dashboard • Failed Payments Telemetry • Opportunity Cards • Approval Screen • Visual Audit Timeline</text>

  <!-- Arrow Down -->
  <path d="M 450 165 L 450 195" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="465" y="185" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">REST API (JSON)</text>

  <!-- FastAPI Container -->
  <rect x="50" y="200" width="800" height="150" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="225" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Python FastAPI Backend</text>

  <!-- Sub Modules -->
  <!-- AI Service -->
  <rect x="70" y="240" width="230" height="90" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="185" y="268" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">AIService</text>
  <text x="185" y="288" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Gemini 2.5 Flash / OpenAI</text>
  <text x="185" y="306" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Demo Heuristic Fallback</text>

  <!-- Policy Engine -->
  <rect x="335" y="240" width="230" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="268" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">PolicyEngine</text>
  <text x="450" y="288" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Deterministic Safety Rules</text>
  <text x="450" y="306" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Budget Caps &amp; Policy Checklist</text>

  <!-- Razorpay Service -->
  <rect x="600" y="240" width="230" height="90" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="715" y="268" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fcd34d" text-anchor="middle">RazorpayService</text>
  <text x="715" y="288" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">REST APIs (/v1/payment_links)</text>
  <text x="715" y="306" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Idempotency &amp; HMAC Webhooks</text>

  <!-- Arrow Down to DB & Audit -->
  <path d="M 450 350 L 450 380" stroke="#34d399" stroke-width="2"/>

  <!-- Database & Audit Layer -->
  <rect x="50" y="385" width="380" height="65" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="413" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">AuditService &amp; Visual Log</text>
  <text x="240" y="432" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sanitized Payload Lifecycle Timeline</text>

  <rect x="470" y="385" width="380" height="65" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="660" y="413" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">Database Storage</text>
  <text x="660" y="432" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">PostgreSQL Primary • SQLite Dev Fallback</text>
</svg>
